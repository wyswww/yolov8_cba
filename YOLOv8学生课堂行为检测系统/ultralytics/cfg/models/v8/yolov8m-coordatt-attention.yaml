# Ultralytics YOLO, AGPL-3.0 license
# YOLOv8m with Coordinate Attention for classroom behavior detection.

nc: 6
scale: m
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, CoordAtt, [256]]       # 5-P3 coordinate attention
  - [-1, 1, Conv, [512, 3, 2]]     # 6-P4/16
  - [-1, 6, C2f, [512, True]]      # 7
  - [-1, 1, CoordAtt, [512]]       # 8-P4 coordinate attention
  - [-1, 1, Conv, [1024, 3, 2]]    # 9-P5/32
  - [-1, 3, C2f, [1024, True]]     # 10
  - [-1, 1, SPPF, [1024, 5]]       # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]]      # 13 cat backbone P4
  - [-1, 3, C2f, [512]]            # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]      # 16 cat backbone P3
  - [-1, 3, C2f, [256]]            # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]     # 19 cat head P4
  - [-1, 3, C2f, [512]]            # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]     # 22 cat head P5
  - [-1, 3, C2f, [1024]]           # 23 (P5/32-large)

  - [[17, 20, 23], 1, Detect, [nc]]
