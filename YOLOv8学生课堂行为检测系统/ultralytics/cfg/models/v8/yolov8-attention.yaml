# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 with Attention Mechanisms for Student Classroom Behavior Detection

# Parameters
nc: 6  # 课堂行为检测：hand-raising, reading, writing, using phone, bowing the head, leaning over the table
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8 Backbone with Attention
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f, [128, True]]  # 2
  - [-1, 1, CBAM, [128]]  # 3 - CBAM attention after P2
  - [-1, 1, Conv, [256, 3, 2]]  # 4-P3/8
  - [-1, 6, C2f, [256, True]]  # 5
  - [-1, 1, CBAM, [256]]  # 6 - CBAM attention after P3
  - [-1, 1, Conv, [512, 3, 2]]  # 7-P4/16
  - [-1, 6, C2f, [512, True]]  # 8
  - [-1, 1, CBAM, [512]]  # 9 - CBAM attention after P4
  - [-1, 1, Conv, [1024, 3, 2]]  # 10-P5/32
  - [-1, 3, C2f, [1024, True]]  # 11
  - [-1, 1, PSA, [1024]]  # 12 - PSA attention at deepest level
  - [-1, 1, SPPF, [1024, 5]]  # 13

# YOLOv8 Head with Attention
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]]  # cat backbone P4
  - [-1, 3, C2f, [512]]  # 16
  - [-1, 1, CBAM, [512]]  # 17 - CBAM in neck

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]  # cat backbone P3
  - [-1, 3, C2f, [256]]  # 20 (P3/8-small)
  - [-1, 1, CBAM, [256]]  # 21 - CBAM in neck

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]  # cat head P4
  - [-1, 3, C2f, [512]]  # 24 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]  # cat head P5
  - [-1, 3, C2f, [1024]]  # 27 (P5/32-large)

  - [[20, 24, 27], 1, Detect, [nc]]  # Detect(P3, P4, P5)